name: Bug report
description: Report a reproducible problem with aka
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `aka --version`.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command
      description: The exact aka command you ran, e.g. `aka web npm run dev`.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps or a minimal project that triggers the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with error messages.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: aka doctor
      description: Output of `aka doctor`, run in the project directory.
      render: text
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Framework and version, runtime (Node, Python, ...), browser.
    validations:
      required: false
